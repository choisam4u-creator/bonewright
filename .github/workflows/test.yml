# Two jobs.
#   unit         — only what runs without Blender (fast). Rig, weight and retarget tests skip themselves
#   blender      — installs the `bpy` wheel and runs **everything**. This is where the project itself is verified
# A green `unit` alone only means "the Python imports"; that is why `blender` is a separate job.
name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - name: Tests (Blender-dependent ones skip themselves)
        run: python -m unittest -v tests.test_mock tests.test_cli tests.test_examples tests.test_errors tests.test_release tests.test_docs tests.test_i18n
      - name: CLI imports
        run: bw --help
      - name: Installed plugin-path points at the real plugin (outside the repository)
        working-directory: ${{ runner.temp }}
        run: test -f "$(bw plugin-path)/.codex-plugin/plugin.json"
      - name: Installed bw doctor --for-issue leaves no home path (BW_HOME sits under home so there is one to replace)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$HOME/bw-home/runs" && printf '{"kimodo": {"root": "%s/kimodo"}, "rig": {"cross_trimm": false}}' "$HOME" > "$HOME/bw-home/runs/config.json"
          BW_HOME="$HOME/bw-home" python "$GITHUB_WORKSPACE/scripts/check_issue_report.py" --expect-config
      - name: Licence boundary — the bonewright/ core does not import bpy (stays MIT)
        run: python scripts/check_license_boundary.py

  blender:
    # Actually runs rig building, skinning and retargeting.
    # Python 3.13 only: `bpy` 5.2.x wheels exist for macOS, Linux and Windows but are **all cp313**, so 3.11 cannot install them
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: System libraries the bpy wheel needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6
      - run: pip install . bpy==5.2.2
      - name: bpy really imports
        run: python -c "import bpy; print('Blender', bpy.app.version_string)"
      - name: Full tests (rig, weights, retargeting included)
        # Rendering is off: the renderer dies on a headless runner (-6). Renders are pictures for people, not verdicts
        # BW_REQUIRE_BLENDER: fail instead of skipping when bpy does not import (no silent green)
        env:
          BW_NO_RENDER: "1"
          BW_REQUIRE_BLENDER: "1"
        run: python -m unittest -v tests.test_mock tests.test_cli tests.test_examples tests.test_errors tests.test_release tests.test_docs tests.test_i18n
      - name: Rig end to end with the installed package (outside the repository — bpy_scripts and prompts are in the wheel)
        # The tests above import bonewright from the repository. This step uses only the `bw` from `pip install .`
        # (on 10/4 `bw plugin-path` was wrong only when installed — files missing from the wheel are invisible in-repo)
        working-directory: ${{ runner.temp }}
        env:
          BW_BACKEND: mock
          BW_NO_RENDER: "1"
          BW_HOME: ${{ runner.temp }}/bw-home
          REPO: ${{ github.workspace }}
        run: |
          python -c "import bonewright, os, sys; sys.exit('imported the repository copy: ' + bonewright.__file__ if bonewright.__file__.startswith(os.environ['REPO']) else 0)"
          bw rig "$REPO/tests/assets/quaternius_adventurer.glb" --no-judge --run-id installed
          test -f bw-home/runs/installed/02_rigged.blend
      - name: Installed bw doctor --for-issue installed — no /home/runner in that run's state.json or log tail
        working-directory: ${{ runner.temp }}
        env:
          BW_HOME: ${{ runner.temp }}/bw-home
        run: python "$GITHUB_WORKSPACE/scripts/check_issue_report.py" installed --expect-code 0
