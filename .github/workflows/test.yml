# Blender 없이 도는 테스트만 돌린다. 리그 생성·가중치·벤치 테스트(RigMockTests)는 Blender 5.2 또는
# bpy 휠이 필요해서 여기서는 자동으로 건너뛴다 — 전부 돌리려면 로컬에서 `python3 -m unittest tests.test_mock`.
name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - name: 테스트(Blender 필요한 것은 자동 skip)
        run: python -m unittest -v tests.test_mock
      - name: CLI 가 임포트되는지
        run: bw --help
      - name: 라이선스 경계 — bonewright/ 본체는 bpy 를 import 하지 않는다(MIT 유지)
        run: python scripts/check_license_boundary.py
